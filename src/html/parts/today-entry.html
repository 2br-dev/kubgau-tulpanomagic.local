@@if(className != 'squirrel'){
	<div class="col l6 m12 s6 xs12 margin-bottom">
}
@@if(className=="squirrel"){
	<div class="col l6 m12 s12 margin-bottom">
}
	<div class="today-entry @@className">
		<img src="./kubgau-tulpanomagic/img/squirrels.webp" alt="@@title">
		<div class="number-wrapper">
			<div class="prefix">
				@@prefix
			</div>
			<div class="number">
				<strong>@@number</strong>
			</div>
		</div>
		<div class="data">
			@@title
		</div>
	</div>
</div>
